name: Build NGK with KernelSU-Next

on:
  push:
    branches: [ s-caf ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Environment & Get KernelSU-Next
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libncurses-dev bison flex bc git libssl-dev wget zip
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu

      - name: Setup Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b 18 clang

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="mstfyqdry"
          export KBUILD_BUILD_HOST="github"
          make -j$(nproc) O=out vayu_defconfig
          make -j$(nproc) O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android-

      - name: Package to AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          rm -rf AnyKernel3/.git AnyKernel3/README.md
          cd AnyKernel3 && zip -r9 ../NGK-KSU-Next-Vayu.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGK-KSU-Next-PocoX3Pro
          path: NGK-KSU-Next-Vayu.zip
